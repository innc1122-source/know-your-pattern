name = "patterna-reflect"
main = "worker.js"
compatibility_date = "2024-11-01"

# Public-ish config. Secrets (GEMINI_API_KEY, optional APP_TOKEN) are NOT
# stored here — set them with `wrangler secret put`. See README.md.
[vars]
# Comma-separated list of origins allowed to call this Worker.
# Leaving this as "*" lets anyone who finds the URL spend your key — set it.
ALLOWED_ORIGIN = "https://innc1122-source.github.io"
# Any Gemini model id. gemini-2.0-flash is free-tier eligible and fast.
MODEL = "gemini-2.0-flash"

# Server-side daily cap, keyed by client IP. Created with
# `wrangler kv namespace create RL`; without this binding the Worker still runs,
# it just falls back to trusting the app's client-side count.
[[kv_namespaces]]
binding = "RL"
id = "23b4ac4e13874298bebf9f7f695f4e33"
