<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9EBE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Know Your Pattern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* developing: latent violet, before the image comes up */
  --bg:#0B0913; --surface:#13101E; --surface2:#1D1830; --raise:#272040;
  --ink:#F3F0FF; --ink2:#ABA0CC; --ink3:#8A80AC;
  --line:rgba(243,240,255,.08); --line2:rgba(243,240,255,.16);
  --accent:#9B6BFF; --accent-2:#C9A4FF;
  --accent-soft:rgba(155,107,255,.16); --accent-line:rgba(155,107,255,.34);
  --on-accent:#120E1E;
  --hl:rgba(255,214,102,.42);
  --voice:#7BE0D6; --voice-soft:rgba(123,224,214,.09);
  --danger:#FF8A6B;
  --sh1:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -6px rgba(80,40,160,.45);
  --sh2:0 2px 8px rgba(0,0,0,.4), 0 26px 56px -16px rgba(80,40,160,.55);
  --glow:0 0 0 1px var(--accent-line), 0 8px 26px -8px rgba(155,107,255,.55);
  --sans:"Plus Jakarta Sans","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --serif:"Newsreader","Noto Serif SC",Georgia,serif;
  --r:18px; --r-sm:14px; --r-lg:26px;
  --ease:cubic-bezier(.22,.9,.28,1);
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#EDE9F7; --surface:#FCFBFF; --surface2:#F2EEFC; --raise:#FFFFFF;
    --ink:#17122A; --ink2:#5B5372; --ink3:#6E6689;
    --line:rgba(23,18,42,.07); --line2:rgba(23,18,42,.14);
    --accent:#7A45E8; --accent-2:#9B6BFF;
    --accent-soft:rgba(122,69,232,.11); --accent-line:rgba(122,69,232,.28);
    --on-accent:#FFFFFF;
    --hl:rgba(255,205,80,.55);
    --voice:#1F8C81; --voice-soft:rgba(31,140,129,.08);
    --danger:#C4482A;
    --sh1:0 1px 2px rgba(23,18,42,.05), 0 5px 14px -5px rgba(90,50,180,.16);
    --sh2:0 2px 8px rgba(23,18,42,.06), 0 22px 48px -16px rgba(90,50,180,.24);
    --glow:0 0 0 1px var(--accent-line), 0 8px 24px -10px rgba(122,69,232,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:430px;height:100%;max-height:920px;background:var(--surface);
  display:flex;flex-direction:column;position:relative;overflow:hidden;
  border-radius:28px;box-shadow:var(--sh2)}
@media(max-width:460px){#app{max-height:none;border-radius:0;box-shadow:none}}

#storagewarn{flex:0 0 auto;background:var(--accent-soft);padding:10px 20px;
  font-size:12.5px;line-height:1.45;color:var(--ink2)}
#view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:32px 22px 40px;animation:rise .42s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

#tabbar{flex:0 0 auto;display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--line)}
.tb{flex:1;background:transparent;border:0;padding:10px 4px;cursor:pointer;border-radius:var(--r-sm);
  font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--ink3);
  transition:color .2s var(--ease),background .2s var(--ease)}
.tb.on{color:var(--accent);background:var(--surface2)}

h1{margin:0;font-weight:600;letter-spacing:-.022em}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink3);margin-bottom:12px}
.eyebrow.mb{margin-bottom:14px}
.mono{font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--ink3)}
.mono.mb{margin-bottom:10px}
.lede{font-size:30px;line-height:1.18;letter-spacing:-.03em;margin-bottom:12px;font-weight:600}
.lede.sm{font-size:23px;letter-spacing:-.025em}
.body{font-size:15px;line-height:1.62;color:var(--ink2);margin:0 0 14px}
.body.ink{color:var(--ink)}
.note{font-size:13.5px;line-height:1.6;color:var(--ink3);margin:0 0 12px}
.rule{height:1px;background:var(--line);margin:26px 0}
.grow{flex:1 1 auto;min-height:18px}

/* short words wrap, sentences take a row each */
.wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.pill{font-family:var(--sans);font-size:15.5px;font-weight:500;color:var(--ink);
  background:var(--surface2);border:1px solid transparent;border-radius:999px;
  padding:13px 19px;cursor:pointer;
  transition:transform .14s var(--ease),background .18s,color .18s,box-shadow .18s}
.pill.stack{display:block;width:100%;text-align:left;margin:0 0 8px;padding:14px 20px}
.pill:active{transform:scale(.985)}
.pill.sel{background:var(--accent);color:var(--on-accent);box-shadow:var(--glow);font-weight:600;transform:translateY(-1px)}
.more{display:block;width:100%;text-align:center;background:transparent;border:0;cursor:pointer;
  font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink3);padding:12px;margin-bottom:6px;
  transition:color .18s}
.more:active{color:var(--ink)}

/* intensity, rendered as developing dots */
.intbar{display:flex;align-items:flex-end;justify-content:center;gap:22px;margin:16px 0 4px}
.intside{text-align:center}
.intdots{display:flex;gap:5px;margin-top:7px}
.intdots i{width:11px;height:11px;border-radius:50%;background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--line2)}
.intdots i.on{background:linear-gradient(180deg,var(--accent-2),var(--accent));box-shadow:0 0 12px -2px var(--accent-line)}

/* option cards: title + description */
.btn{display:block;width:100%;text-align:left;font-family:var(--sans);font-size:15px;font-weight:500;
  color:var(--ink);background:var(--surface2);border:1px solid transparent;border-radius:var(--r);
  padding:15px 17px;margin:0 0 9px;cursor:pointer;
  transition:transform .14s var(--ease),background .18s,box-shadow .18s}
.btn:active{transform:scale(.985)}
.btn.sel{background:var(--accent);color:var(--on-accent);box-shadow:var(--sh1)}
.btn .k{display:block;font-size:15px;font-weight:600;margin-bottom:3px;letter-spacing:-.01em}
.btn.sel .k{color:var(--surface)}
.btn:not(.sel) .k{color:var(--ink)}
.btn.hasdesc{font-size:13.5px;color:var(--ink2);line-height:1.5}
.btn.hasdesc.sel{color:rgba(255,255,255,.7)}
.btn.danger{color:var(--danger)}

.cta{display:block;width:100%;text-align:center;font-family:var(--sans);font-size:16px;font-weight:600;
  background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;
  padding:16px;cursor:pointer;margin-top:8px;box-shadow:var(--sh1);
  transition:transform .14s var(--ease),opacity .18s}
.cta:active{transform:scale(.975)}
.cta{box-shadow:var(--glow)}
.cta:disabled{opacity:.3;box-shadow:none}
.cta.ghost{background:transparent;color:var(--ink2);box-shadow:none;font-weight:500}

textarea{width:100%;font-family:var(--sans);font-size:16px;line-height:1.55;color:var(--ink);
  background:var(--surface2);border:1px solid transparent;border-radius:var(--r);
  padding:14px 15px;resize:none;outline:none;transition:border-color .2s,background .2s}
textarea:focus{border-color:var(--line2);background:var(--surface)}
textarea::placeholder{color:var(--ink3)}
.seg{display:flex;gap:8px;background:var(--surface2);padding:4px;border-radius:999px}
.seg button{flex:1;font-family:var(--sans);font-size:14.5px;font-weight:600;padding:11px;border:0;
  background:transparent;color:var(--ink2);border-radius:999px;cursor:pointer;transition:all .2s var(--ease)}
.seg button.on{background:var(--accent);color:var(--on-accent);box-shadow:var(--sh1)}

/* the product's own voice */
.saidcard{background:var(--voice-soft);box-shadow:inset 0 0 0 1px rgba(123,224,214,.16);border-radius:var(--r-lg);padding:22px 20px;margin:0 0 16px;
  animation:rise .5s var(--ease) both}
.saidcard .who{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--voice);margin-bottom:11px}
.saidcard p{font-family:var(--serif);font-size:21px;line-height:1.4;letter-spacing:-.012em;margin:0;color:var(--ink)}

.hl{background-image:linear-gradient(var(--hl),var(--hl));background-repeat:no-repeat;
  background-size:0% 42%;background-position:0 78%;transition:background-size .85s .25s var(--ease);
  -webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .08em;border-radius:2px}
.hl.on{background-size:100% 42%}
@media(prefers-reduced-motion:reduce){.hl{transition:none}.pad,.saidcard{animation:none}}

.evline{padding:13px 0;border-top:1px solid var(--line)}
.evline.first{border-top:0;padding-top:4px}
.evline .d{font-size:12.5px;font-weight:600;color:var(--ink3);margin-bottom:4px}
.evline .t{font-size:15px;line-height:1.5}

.meterrow{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.meterrow .nm{font-size:15px;font-weight:600;min-width:76px;letter-spacing:-.01em}
.meter{flex:1;height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent-2) 100%);
  transform-origin:left;animation:grow .8s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.meterrow .ct{font-size:13px;font-weight:600;color:var(--ink3);min-width:30px;text-align:right}

.ghostbox{background:var(--surface2);border-radius:var(--r-lg);padding:28px 18px;margin:8px 0 16px;text-align:center}
.ghostrow{display:flex;align-items:center;justify-content:center;gap:20px;opacity:.4;margin-top:12px}
.ghostval{font-family:var(--serif);font-size:26px}
.arrow{font-size:19px;color:var(--ink3)}
.chcard{background:var(--surface2);border-radius:var(--r-lg);padding:22px 20px;margin-bottom:14px}
.chname{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.thenrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:14px}
.bignum{font-family:var(--serif);font-size:38px;line-height:1;letter-spacing:-.02em}
.respname{font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--surface);
  padding:7px 13px;border-radius:999px}

/* capture progress */
.prog{display:flex;gap:5px;margin-bottom:22px}
.prog i{height:3px;flex:1;background:var(--surface2);border-radius:999px;transition:background .35s var(--ease)}
.prog i.on{background:var(--accent)}

#overlay,#onboard{position:absolute;inset:0;background:var(--surface);display:none;flex-direction:column}
#overlay{z-index:20}#onboard{z-index:30}
#overlay.on,#onboard.on{display:flex;animation:sheet .34s var(--ease) both}
@keyframes sheet{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#flowbox,#obbox{flex:1 1 auto;overflow-y:auto;padding:34px 22px 36px;display:flex;flex-direction:column}
.obdots{display:flex;gap:6px;margin-bottom:20px}
.obdots i{width:22px;height:3px;border-radius:999px;background:var(--surface2)}
.obdots i.on{background:var(--accent)}
.mic{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:10px;
  font-family:var(--sans);font-size:14.5px;font-weight:600;color:var(--ink2);
  background:var(--surface2);border:0;border-radius:999px;padding:13px;cursor:pointer;
  transition:background .2s var(--ease),color .2s}
.mic .dot{width:9px;height:9px;border-radius:50%;background:var(--ink3);transition:background .2s}
.mic.rec{background:var(--accent-soft);color:var(--ink)}
.mic.rec .dot{background:var(--accent);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.extag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);background:var(--surface);padding:4px 10px;border-radius:999px;margin-bottom:12px}
.exrow{display:flex;align-items:flex-start;justify-content:center;gap:20px;opacity:.55;margin-top:6px}
.exnum{font-family:var(--serif);font-size:30px;line-height:1.1;margin:3px 0}
.exlab{font-size:12px;font-weight:600;color:var(--ink3)}
/* weekly snapshot — the day 7 payoff */
.weekcard{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line);border-radius:var(--r-lg);padding:22px 20px;margin-bottom:26px;
  animation:rise .5s var(--ease) both}
.wtitle{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.wcount{font-family:var(--serif);font-size:22px;line-height:1.3;margin:0 0 16px;color:var(--ink)}
.wrow{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-top:1px solid var(--line)}
.wrow.col{flex-direction:column;align-items:flex-start;gap:6px}
.wlab{font-size:12.5px;font-weight:600;color:var(--ink3);flex:0 0 auto}
.wval{font-size:14.5px;font-weight:600;text-align:right}
.wquote{font-family:var(--serif);font-size:16px;line-height:1.45;color:var(--ink)}
.wcarry{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.wcarry p{font-family:var(--serif);font-size:17px;line-height:1.4;margin:7px 0 0;color:var(--ink)}
.wdismiss{width:100%;margin-top:18px;background:transparent;border:0;cursor:pointer;
  font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink2);padding:8px}

/* half-filled comparison, while the other half is still being earned */
.halfrow{display:flex;align-items:flex-start;justify-content:center;gap:20px;margin-top:14px}
.half{text-align:center;flex:1}
.half.pending{opacity:.4}
.bignum.dim{color:var(--ink3)}
/* the saidcard develops rather than just fading in */
@keyframes develop{
  from{opacity:0;transform:translateY(12px) scale(.985);filter:saturate(.4) brightness(.85)}
  to{opacity:1;transform:none;filter:none}
}
.saidcard{animation:develop .62s var(--ease) both}

/* options arrive in sequence, not all at once */
.pill{animation:pop .34s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.pill:nth-child(1){animation-delay:.02s}.pill:nth-child(2){animation-delay:.05s}
.pill:nth-child(3){animation-delay:.08s}.pill:nth-child(4){animation-delay:.11s}
.pill:nth-child(5){animation-delay:.14s}.pill:nth-child(6){animation-delay:.17s}
.pill:nth-child(7){animation-delay:.20s}.pill:nth-child(8){animation-delay:.23s}
.pill:nth-child(9){animation-delay:.26s}.pill:nth-child(10){animation-delay:.29s}

/* the active tab carries a small light */
.tb.on{position:relative}
.tb.on::after{content:'';position:absolute;left:50%;bottom:3px;width:14px;height:2px;margin-left:-7px;
  border-radius:999px;background:var(--accent);box-shadow:0 0 10px -1px var(--accent)}

@media(prefers-reduced-motion:reduce){
  .saidcard,.pill{animation:none}
}
/* Mirror: their two answers, stitched into one sentence, in their own voice */
.chose{background:var(--surface2);border-radius:var(--r-lg);padding:22px 20px;margin:4px 0 18px;
  animation:develop .6s var(--ease) both}
.chose .lab{font-size:13.5px;font-weight:500;color:var(--ink3);margin-bottom:6px}
.chose .lab:not(:first-child){margin-top:16px}
.chose .quote{font-family:var(--serif);font-size:23px;line-height:1.32;letter-spacing:-.015em;
  color:var(--accent);font-weight:500}
@media(prefers-reduced-motion:reduce){.chose{animation:none}}
/* the pattern reveal: not X, but Y — the turn is the insight */
.contrast .lab{font-size:13.5px;font-weight:500;color:var(--ink3);margin-bottom:5px}
.contrast .lab:not(:first-child){margin-top:14px}
.contrast .side{font-family:var(--serif);font-size:23px;line-height:1.32;letter-spacing:-.015em;font-weight:500}
.contrast .side.dim{color:var(--ink2)}
.contrast .side.hot{color:var(--accent)}
.hidden{display:none !important}
</style>
</head>
<body>
<div id="app">
  <div id="storagewarn" class="hidden"></div>
  <div id="view"></div>
  <div id="tabbar"></div>
  <div id="overlay"><div id="flowbox"></div></div>
  <div id="onboard"><div id="obbox"></div></div>
</div>
<input type="file" id="importFile" accept="application/json" class="hidden" onchange="if(this.files[0])doImport(this.files[0])">
<script>/* =====================================================================
   KYP ENGINE — pure functions, no DOM. Portable to Python later.
   A moment: {id, ts, text, reaction, signal, protecting, response, note}
   ===================================================================== */

const KYP = (() => {

  const DAY = 86400000;
  const dayKey = ts => new Date(ts).toISOString().slice(0,10);
  const weekKey = ts => { const d=new Date(ts); const o=new Date(d); o.setDate(d.getDate()-((d.getDay()+6)%7)); return o.toISOString().slice(0,10); };

  /* ---- thresholds: the only numbers worth tuning after real data ---- */
  const TH = {
    connectMin:   2,   // 2nd time a signal appears -> connection
    glimpseCount: 3,   // occurrences needed for a glimpse
    glimpseDays:  2,   // across at least this many distinct days
    glimpseWindow:8,   // looking at the last N moments
    patternCount: 5,   // occurrences needed to call it a pattern
    patternWeeks: 3,   // spread across this many distinct weeks
    patternShare: 0.30,// must be at least this share of all signals
    patternLead:  1.5, // and must lead the runner-up by this factor
    changeMin:    6,   // moments on one signal before comparing responses
    changeSpanDays:21, // and this much elapsed time
  };

  /* ---------- helpers ---------- */
  const bySignal = (ms, s) => ms.filter(m => m.signal === s);
  const distinct = arr => [...new Set(arr)];

  function counts(ms){
    const c = {};
    ms.forEach(m => { if(m.signal && m.signal !== 'other') c[m.signal] = (c[m.signal]||0)+1; });
    return c;
  }

  function ranked(ms){
    const c = counts(ms);
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([signal,n])=>({signal,n}));
  }

  /* ---------- 1. connection: has this signal been here before? ---------- */
  function connection(ms, current){
    if(!current.signal) return null;
    const prior = ms.filter(m => m.id !== current.id && m.signal === current.signal);
    if(prior.length < TH.connectMin - 1) return null;
    const last = prior[prior.length-1];
    return { signal: current.signal, priorCount: prior.length, withMoment: last };
  }

  /* ---------- 2. glimpse: a signal starting to show, not a conclusion ---------- */
  function glimpse(ms){
    const recent = ms.slice(-TH.glimpseWindow);
    const r = ranked(recent);
    if(!r.length) return null;
    const top = r[0];
    if(top.n < TH.glimpseCount) return null;
    const days = distinct(bySignal(recent, top.signal).map(m=>dayKey(m.ts)));
    if(days.length < TH.glimpseDays) return null;
    // already a full pattern? then glimpse is redundant
    if(pattern(ms)) return null;
    return { signal: top.signal, hits: top.n, of: recent.length, days: days.length };
  }

  /* ---------- 3. prediction: the product puts itself on the line ---------- */
  function makePrediction(ms, signal){
    return { id:'p'+Date.now(), signal, createdTs:Date.now(), status:'open', result:null };
  }
  // a prediction becomes checkable when a new moment carries the same signal
  function checkablePrediction(preds, moment){
    return preds.find(p => p.status==='open' && p.signal===moment.signal && moment.ts > p.createdTs) || null;
  }
  function predictionScore(preds){
    const done = preds.filter(p=>p.status==='closed');
    if(!done.length) return null;
    const hit = done.filter(p=>p.result==='yes').length;
    const part = done.filter(p=>p.result==='kind of').length;
    return { total:done.length, hit, part, miss:done.length-hit-part };
  }

  /* ---------- 4. pattern: earned, with a confidence that can go down ---------- */
  function pattern(ms){
    const r = ranked(ms);
    if(!r.length) return null;
    const top = r[0];
    const total = ms.filter(m=>m.signal && m.signal!=='other').length;
    if(top.n < TH.patternCount) return null;
    if(total && top.n/total < TH.patternShare) return null;
    // two signals neck and neck is not one pattern, it's two things
    if(r[1] && top.n < r[1].n * TH.patternLead) return null;
    const rows = bySignal(ms, top.signal);
    const weeks = distinct(rows.map(m=>weekKey(m.ts)));
    if(weeks.length < TH.patternWeeks) return null;

    // confidence 1-5: volume + spread + user confirmation, minus rejections
    let conf = 1;
    if(top.n >= TH.patternCount) conf++;
    if(weeks.length >= 4) conf++;
    if(total && top.n/total >= 0.45) conf++;
    const confirmed = rows.filter(m=>m.confirm==='yes').length;
    const rejected  = rows.filter(m=>m.confirm==='no').length;
    if(confirmed >= 2) conf++;
    if(rejected  >= 2) conf--;
    conf = Math.max(1, Math.min(5, conf));

    const runner = r[1] ? r[1].signal : null;
    return { signal: top.signal, hits: top.n, total, weeks: weeks.length, confidence: conf, alternative: runner };
  }

  /* ---------- 5. change: same trigger, different response ---------- */
  function change(ms, signal){
    const rows = bySignal(ms, signal).filter(m=>m.response);
    if(rows.length < TH.changeMin) return null;
    const span = rows[rows.length-1].ts - rows[0].ts;
    if(span < TH.changeSpanDays*DAY) return null;
    const half = Math.floor(rows.length/2);
    const dist = set => {
      const c={}; set.forEach(m=>c[m.response]=(c[m.response]||0)+1);
      const n=set.length; const out={};
      Object.entries(c).forEach(([k,v])=>out[k]=Math.round(v/n*100));
      return out;
    };
    const then = dist(rows.slice(0,half)), now = dist(rows.slice(half));
    const keys = distinct([...Object.keys(then),...Object.keys(now)]);
    const moves = keys.map(k=>({response:k, then:then[k]||0, now:now[k]||0, delta:(now[k]||0)-(then[k]||0)}))
                      .sort((a,b)=> Math.abs(b.delta)-Math.abs(a.delta) || b.delta-a.delta);

    // intensity: same trigger, does it still hit as hard?
    const iv = set => { const v = set.map(m=>m.iv).filter(n=>typeof n==='number');
                        return v.length ? v.reduce((s,n)=>s+n,0)/v.length : null; };
    const withI = bySignal(ms, signal).filter(m=>typeof m.iv==='number');
    let intensity = null;
    if(withI.length >= TH.changeMin){
      const h = Math.floor(withI.length/2);
      const a2 = iv(withI.slice(0,h)), b2 = iv(withI.slice(h));
      if(a2 !== null && b2 !== null)
        intensity = { then:Math.round(a2*10)/10, now:Math.round(b2*10)/10,
                      delta:Math.round((b2-a2)*10)/10, softer:(a2-b2) >= 0.4 };
    }

    return { signal, n:rows.length, spanDays:Math.round(span/DAY), then, now, moves, intensity,
             headline: moves[0] && Math.abs(moves[0].delta)>=12 ? moves[0] : null };
  }

  function changesAll(ms){
    return distinct(ms.map(m=>m.signal).filter(Boolean))
      .map(s=>change(ms,s)).filter(Boolean).sort((a,b)=>b.n-a.n);
  }

  /* ---------- what the Changes tab shows while still empty ---------- */
  function untilFirstChange(ms){
    const r = ranked(ms);
    if(!r.length) return TH.changeMin;
    return Math.max(0, TH.changeMin - r[0].n);
  }

  /* precisely what is still missing before a comparison is honest */
  function unlockProgress(ms){
    const r = ranked(ms);
    if(!r.length) return {signal:null, needCount:TH.changeMin, needDays:TH.changeSpanDays};
    const top = r[0];
    const rows = bySignal(ms, top.signal);
    const span = rows.length ? (rows[rows.length-1].ts - rows[0].ts)/DAY : 0;
    return {
      signal: top.signal,
      have: top.n,
      needCount: Math.max(0, TH.changeMin - top.n),
      needDays: Math.max(0, Math.ceil(TH.changeSpanDays - span))
    };
  }

  /* the current picture — honest from 3 moments, because it claims no trend */
  function snapshotNow(ms, signal){
    const rows = bySignal(ms, signal).filter(m=>m.response);
    if(rows.length < 3) return null;
    const c = {}; rows.forEach(m=>c[m.response]=(c[m.response]||0)+1);
    const mix = Object.entries(c).map(([response,n])=>({response, pct:Math.round(n/rows.length*100)}))
                      .sort((a,b)=>b.pct-a.pct);
    return { signal, n:rows.length, mix };
  }

  /* ---------- weekly snapshot: the day-7 payoff ---------- */
  function weekOf(ms, endTs){
    const end = endTs || Date.now(), start = end - 7*DAY;
    return ms.filter(m => m.ts > start && m.ts <= end);
  }
  function weeklySnapshot(ms, endTs){
    if(!ms.length) return null;
    const end = endTs || Date.now();
    if(end - ms[0].ts < 7*DAY) return null;      // needs a week of history
    const rows = weekOf(ms, end);
    if(rows.length < 2) return null;             // a quiet week gets no card, and no nagging
    const sc = counts(rows);
    const top = Object.entries(sc).sort((a,b)=>b[1]-a[1])[0] || null;
    const rc = {}; rows.forEach(m=>{ if(m.reaction) rc[m.reaction]=(rc[m.reaction]||0)+1; });
    const topReaction = Object.entries(rc).sort((a,b)=>b[1]-a[1])[0] || null;
    const wrote = rows.filter(m=>m.note && m.note.trim().length>4).slice(-1)[0] || null;
    return { n:rows.length, weekKey: weekKey(end),
             topSignal: top ? top[0] : null, topSignalN: top ? top[1] : 0,
             topReaction: topReaction ? topReaction[0] : null,
             wrote: wrote ? wrote.note : null };
  }

  return { TH, counts, ranked, connection, glimpse, pattern, change, changesAll,
           makePrediction, checkablePrediction, predictionScore, untilFirstChange,
           unlockProgress, snapshotNow, weeklySnapshot, weekOf, dayKey, weekKey };
})();

/* =====================================================================
   STORAGE — localStorage when available, memory otherwise, always exportable
   ===================================================================== */
const Store = (() => {
  const KEY = 'kyp.v1';
  let mem = null, ok = true;
  try { localStorage.setItem('kyp.t','1'); localStorage.removeItem('kyp.t'); }
  catch(e){ ok = false; }
  const blank = () => ({moments:[], predictions:[], lang:'zh', onboarded:false, created:Date.now()});
  return {
    persistent: ok,
    load(){
      if(mem) return mem;
      if(ok){ try{ const raw=localStorage.getItem(KEY); mem = raw?JSON.parse(raw):blank(); }catch(e){ mem=blank(); } }
      else mem = blank();
      return mem;
    },
    save(d){ mem=d; if(ok){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} } },
    reset(){ mem=blank(); if(ok){ try{ localStorage.removeItem(KEY); }catch(e){} } return mem; }
  };
})();

function persist(){ D.lang = L; Store.save(D); }
function fmtDate(ts){
  const d=new Date(ts), n=new Date(), diff=Math.floor((n-d)/86400000);
  if(diff===0) return L==='zh'?'今天':'Today';
  if(diff===1) return L==='zh'?'昨天':'Yesterday';
  if(diff<7)   return L==='zh'?diff+' 天前':diff+' days ago';
  return L==='zh' ? (d.getMonth()+1)+'月'+d.getDate()+'日'
                  : d.toLocaleDateString('en',{month:'short',day:'numeric'});
}

function startFlow(){
  showAllSignals = false;
  flow = {step:0, started:Date.now(), m:{id:uid(), ts:Date.now(), text:'', reaction:'', signal:'', protecting:'', intensity:'', response:'', note:'', other:{}},
          queue:[], qi:0, checkPred:null};
  $('overlay').classList.add('on');
  renderFlow();
}
function closeFlow(){ flow=null; $('overlay').classList.remove('on'); render(); }


/* Order the options by what they wrote. Wording never changes — only sequence.
   A miss costs nothing: the rest of the list is one tap away. */
function rankSignals(text){
  const t = (text||'').toLowerCase();
  const scored = SIGNAL_KEYS.map((k,i)=>{
    let hits = 0;
    (KEYWORDS[k]||[]).forEach(w=>{ if(w && t.includes(String(w).toLowerCase())) hits++; });
    return {k, hits, i};
  });
  const any = scored.some(s=>s.hits>0);
  scored.sort((a,b)=> b.hits-a.hits || a.i-b.i);
  return {order:scored.map(s=>s.k), guessed:any};
}
let showAllSignals = false;
function toggleSignals(){ showAllSignals = !showAllSignals; renderFlow(); }

/* short words wrap; long sentences take a row each */
function optionLayout(){ return 'stack'; }

const STEPS = ['what','reaction','signal','intensity','response'];

function renderFlow(){
  const f = flow; if(!f) return;
  const box = $('flowbox');
  if(f.step < STEPS.length){ box.innerHTML = stepView(STEPS[f.step]); }
  else { box.innerHTML = revealView(); }
  box.scrollTop = 0;
  micUp(); micReady();
}

function stepView(k){
  const m = flow.m;
  const prog = `<div class="prog">${STEPS.map((_,i)=>`<i class="${i<=flow.step?'on':''}"></i>`).join('')}</div>`;
  const head = (h,b='') => prog + `<h1 class="lede sm">${h}</h1>${b?`<p class="body">${b}</p>`:''}`;
  const other = field => m[field]==='other' ? `
    <textarea id="fOther_${field}" rows="2" placeholder="${c().otherPh}"
      oninput="setOther('${field}',this.value)">${esc((m.other||{})[field]||'')}</textarea>
    <button class="cta" onclick="stepNext()">${c().next}</button>` : '';
  const opts = (obj,field) => {
    const entries = Object.entries(obj);
    const mode = optionLayout(entries.map(([,v])=>v[L]||v));
    const inner = entries.map(([key,v])=>
      `<button class="pill ${mode} ${m[field]===key?'sel':''}" onclick="pick('${field}','${key}')">${v[L]||v}</button>`).join('');
    return (mode==='wrap' ? `<div class="wrap">${inner}</div>` : inner) + other(field);
  };

  if(k==='what') return head(c().whatHappened, c().oneSentence) +
    `<textarea id="fWhat" rows="4" placeholder="${c().whatPh}" oninput="setText(this.value)">${esc(m.text)}</textarea>
     <button id="micBtn" class="mic hidden" onpointerdown="micDown(event)" onpointerup="micUp()" onpointercancel="micUp()" onpointerleave="micUp()">
       <span class="dot"></span><span id="micLabel">${c().holdTalk}</span></button>
     <div class="grow"></div>
     <button class="cta" id="fNext" ${m.text.trim().length<2?'disabled':''} onclick="stepNext()">${c().next}</button>
     <button class="cta ghost" onclick="closeFlow()">${c().cancel}</button>`;

  if(k==='reaction') return head(c().firstReaction) + opts(REACTIONS,'reaction') + backOnly();
  if(k==='signal'){
    const r = rankSignals(m.text);
    const showN = (r.guessed && !showAllSignals) ? 3 : SIGNAL_KEYS.length;
    const shown = r.order.slice(0, showN);
    const rest  = r.order.length - showN;
    const cell = key => `<button class="pill stack ${m.signal===key?'sel':''}" onclick="pick('signal','${key}')">${SIGNALS[key][L].s}</button>`;
    return head(c().whatGot, c().closest) +
      shown.map(cell).join('') +
      (rest > 0
        ? `<button class="more" onclick="toggleSignals()">${c().moreOptions} · ${rest}</button>`
        : (r.guessed ? `<button class="more" onclick="toggleSignals()">${c().fewerOptions}</button>` : '')) +
      `<button class="pill stack ${m.signal==='other'?'sel':''}" onclick="pick('signal','other')">${REACTIONS.other[L]}</button>` +
      other('signal') + backOnly();
  }

  if(k==='intensity') return head(c().intensityH) + opts(INTENSITY,'intensity') + backOnly();
  if(k==='response') return head(c().whatDid) + opts(RESPONSES,'response') + backOnly();
}
function backOnly(){ return `<div class="grow"></div><button class="cta ghost" onclick="stepBack()">${c().back}</button>`; }

function pick(field,key){
  flow.m[field]=key;
  renderFlow();
  if(key==='other'){ setTimeout(()=>{const t=$('fOther_'+field); if(t) t.focus();},60); return; }
  setTimeout(stepNext,140);
}
function stepBack(){ if(flow.step>0){flow.step--; renderFlow();} }
function stepNext(){
  flow.step++;
  if(flow.step === STEPS.length) commit();
  renderFlow();
}

/* ---------- commit: save, then build the reveal queue ---------- */
function commit(){
  const f = flow, m = f.m;
  m.ts = Date.now();
  m.secs = Math.max(8, Math.round((Date.now()-f.started)/1000));
  if(m.intensity && INTENSITY[m.intensity]) m.iv = INTENSITY[m.intensity].v;
  D.moments.push(m);

  const q = ['mirror'];

  // a guess waiting to be checked comes before anything new
  const cp = KYP.checkablePrediction(D.predictions, m);
  if(cp){ f.checkPred = cp; q.push('predcheck'); }

  D.seen = D.seen || {glimpse:{}, pattern:{}};
  const g = KYP.glimpse(D.moments);
  const p = KYP.pattern(D.moments);

  if(p && D.seen.pattern[p.signal] !== p.confidence){
    q.push('pattern'); D.seen.pattern[p.signal] = p.confidence;
  } else if(g && (D.seen.glimpse[g.signal]||0) < g.hits){
    q.push('glimpse');
    D.seen.glimpse[g.signal] = g.hits;
    if(!D.predictions.some(x=>x.status==='open' && x.signal===g.signal)){
      D.predictions.push(KYP.makePrediction(D.moments, g.signal));
      q.push('prediction');
    }
  } else {
    const conn = KYP.connection(D.moments, m);
    if(conn) q.push('connection');
  }

  f.queue = q; f.qi = 0;
  persist();
}

function revealView(){
  const f = flow, m = f.m, k = f.queue[f.qi];
  const s = sig(m.signal);
  const last = f.qi >= f.queue.length-1;
  const nextBtn = t => `<div class="grow"></div><button class="cta" onclick="${last?'closeFlow()':'qNext()'}">${t}</button>`;

  if(k==='mirror'){
    return `<div class="eyebrow">${c().seconds(m.secs)}</div>
      <h1 class="lede sm">${c().mirrorH}</h1>
      <p class="body">${c().mirrorB}</p>
      <div class="chose">
        <div class="lab">${c().youChose}</div>
        <div class="quote">「${m.signal==='other'? esc((m.other||{}).signal||'') : s.s}」</div>
        <div class="lab">${c().andAlso}</div>
        <div class="quote">「${m.intensity?INTENSITY[m.intensity][L]:''}」</div>
      </div>
      <div class="saidcard"><div class="who">${c().speaker}</div>
        <p>${c().mirrorPromise(m.signal==='other' ? (m.otherText||'') : s.n)}</p></div>
      ${nextBtn(c().done)}`;
  }

  if(k==='predcheck'){
    const ps = sig(f.checkPred.signal);
    return `<div class="eyebrow">${c().ourGuess}</div>
      <h1 class="lede sm">${c().rememberGuess}</h1>
      <div class="saidcard"><div class="who">${c().speaker}</div><p>${ps.p}</p></div>
      <p class="body">${c().wasItTrue}</p>
      <button class="btn" onclick="closePred('yes')">${c().yes}</button>
      <button class="btn" onclick="closePred('kind of')">${c().kindOf}</button>
      <button class="btn" onclick="closePred('no')">${c().no}</button>
      <div class="grow"></div>`;
  }

  if(k==='predresult'){
    return `<div class="eyebrow">${c().ourGuess}</div>
      <h1 class="lede sm">${f.predResult==='no' ? c().adjusted : c().noted}</h1>
      ${nextBtn(c().done)}`;
  }

  if(k==='connection'){
    const conn = KYP.connection(D.moments, m);
    return `<div class="eyebrow">${c().connH}</div>
      <div class="saidcard"><div class="who">${c().speaker}</div>
        <p><span class="hl on">${s.g}</span></p></div>
      <p class="body">${c().connB((conn?conn.priorCount:1)+1)}</p>
      ${D.moments.filter(x=>x.signal===m.signal).slice(-2).reverse().map(x=>`
        <div class="evline"><div class="d">${fmtDate(x.ts)}</div><div class="t">${esc(x.text)}</div></div>`).join('')}
      ${nextBtn(c().done)}`;
  }

  if(k==='glimpse'){
    const g = KYP.glimpse(D.moments) || {hits:0,of:0,signal:m.signal};
    const gs = sig(g.signal);
    return `<h1 class="lede sm">${c().glimpseH}</h1>
      <p class="body">${c().glimpseB(g.hits,g.of)}</p>
      <div class="saidcard"><div class="who">${c().speaker}</div>
        <p><span class="hl on">${gs.g}</span></p></div>
      <p class="note">${c().tooEarly}</p>
      <div class="rule"></div>
      <div class="eyebrow">${c().yourRead}</div>
      <textarea id="fNote" rows="3" placeholder="${c().yourReadPh}" oninput="setNote(this.value)"></textarea>
      <div class="grow"></div>
      <button class="cta" onclick="saveNote()">${c().keepWatching}</button>
      <button class="cta ghost" onclick="${last?'closeFlow()':'qNext()'}">${c().skip}</button>`;
  }

  if(k==='prediction'){
    const op = D.predictions.filter(x=>x.status==='open').slice(-1)[0];
    const os = sig(op ? op.signal : m.signal);
    return `<div class="eyebrow">${c().ourGuess}</div>
      <div class="saidcard"><div class="who">${c().ourGuess}</div><p>${os.p}</p></div>
      <p class="note">${c().seeIfRight}</p>
      ${nextBtn(c().wellSee)}`;
  }

  if(k==='pattern'){
    const p = KYP.pattern(D.moments);
    const ps = sig(p.signal);
    return `<div class="eyebrow">${c().possiblePattern}</div>
      <div class="saidcard"><div class="who">${c().speaker}</div>${patternSentence(ps)}</div>
      <div class="meterrow"><span class="nm">${c().confidence}</span>
        <div class="meter"><i style="width:${p.confidence*20}%"></i></div><span class="ct">${p.confidence} / 5</span></div>
      <p class="note">${c().basedOn(p.hits,p.total)}</p>
      <div class="rule"></div>
      <div class="eyebrow mb">${c().feelTrue}</div>
      <button class="btn" onclick="confirmPattern('yes')">${c().thatsMe}</button>
      <button class="btn" onclick="confirmPattern('maybe')">${c().maybe}</button>
      <button class="btn" onclick="confirmPattern('no')">${c().notReally}</button>
      <div class="grow"></div>`;
  }
  return nextBtn(c().done);
}

function qNext(){ flow.qi++; if(flow.qi>=flow.queue.length) closeFlow(); else renderFlow(); }
function saveNote(){ const v=$('fNote').value.trim(); flow.m.note=v; persist();
  if(flow.qi>=flow.queue.length-1) closeFlow(); else qNext(); }
function closePred(result){
  const p = flow.checkPred;
  p.status='closed'; p.result=result; p.closedTs=Date.now();
  flow.predResult=result;
  flow.queue.splice(flow.qi+1,0,'predresult');
  persist(); qNext();
}
function confirmPattern(v){
  flow.m.confirm = v;
  persist();
  if(flow.qi>=flow.queue.length-1) closeFlow(); else qNext();
}

/* =====================================================================
   DATA
   ===================================================================== */
function doExport(){
  const blob = new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'know-your-pattern-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function doImport(file){
  const r = new FileReader();
  r.onload = () => { try{
    const j = JSON.parse(r.result);
    if(!j.moments) throw 0;
    D = j; L = D.lang||L; persist(); render();
  }catch(e){ alert('Not a valid backup file.'); } };
  r.readAsText(file);
}
function doClear(){ if(confirm(c().clearConfirm)){ D = Store.reset(); L=D.lang; render(); } }

function loadDemo(){
  if(D.moments.length && !confirm(c().demoWarn)) return;
  D = Store.reset(); D.lang = L;
  const DAY = 86400000, now = Date.now();
  const texts = {
    zh:{autonomy:['领导没问我就加了任务','朋友临时改了约的时间','有人替我答应了周末','排期被调整没人先说','会议时间被直接改掉'],
        heard:['我的提议在会上被跳过','说了两次还是没人接','群里的问题没人回'],
        capacity:['手上还没做完又来一件','这周第三次加需求']},
    en:{autonomy:['A task was added without asking me','A friend moved our plan last minute','Someone said yes for me','The schedule shifted, nobody told me','My meeting got moved without a word'],
        heard:['My suggestion got skipped in the meeting','Said it twice, nobody picked it up','My question in the group went unanswered'],
        capacity:['Another thing arrived before I finished','Third scope change this week']}
  }[L];
  const add = (daysAgo, signal, response, i, intensity) => D.moments.push({
    id:uid(), ts: now - daysAgo*DAY, text: texts[signal][i % texts[signal].length],
    reaction:'irritated', signal, intensity, iv: INTENSITY[intensity].v, response, secs:38, note:''
  });
  // autonomy: reacting early on, pausing lately -> a real Then→Now
  [88,81,74,66,59].forEach((d,i)=>add(d,'autonomy','react_now',i,'strong'));
  [45,38].forEach((d,i)=>add(d,'autonomy','held_in',i,'medium'));
  [24,15,6,2].forEach((d,i)=>add(d,'autonomy','paused',i,'light'));
  [70,40,12].forEach((d,i)=>add(d,'heard','held_in',i,'medium'));
  [55,20].forEach((d,i)=>add(d,'capacity','complied',i,'medium'));
  D.moments.sort((a,b)=>a.ts-b.ts);
  D.moments[9].note = L==='zh' ? '我可能不是怕事情多，是讨厌别人替我决定。'
                               : "I don't think I mind the work. I mind not being asked.";
  D.predictions = [{id:'p1',signal:'autonomy',createdTs:now-50*DAY,status:'closed',result:'yes'},
                   {id:'p2',signal:'autonomy',createdTs:now-30*DAY,status:'closed',result:'kind of'},
                   {id:'p3',signal:'heard',   createdTs:now-25*DAY,status:'closed',result:'no'}];
  D.seen = {glimpse:{},pattern:{}};
  persist(); go('changes');
}

/* =====================================================================
   ONBOARDING — the contract, before anything is recorded
   ===================================================================== */
let ob = 0;
function startOnboard(){ ob = 0; $('onboard').classList.add('on'); renderOb(); }
function obNext(){ ob++; if(ob > 3) finishOb(); else renderOb(); }
function finishOb(){ D.onboarded = true; persist(); $('onboard').classList.remove('on'); render(); }
function obLang(l){ L = l; persist(); renderOb(); }

function renderOb(){
  const box = $('obbox');
  if(ob === 0){
    box.innerHTML = `<div class="grow"></div>
      <div class="eyebrow">${c().obLang}</div>
      <div class="seg" style="margin-bottom:12px">
        <button class="${L==='zh'?'on':''}" onclick="obLang('zh')">中文</button>
        <button class="${L==='en'?'on':''}" onclick="obLang('en')">English</button>
      </div>
      <button class="btn" onclick="obLang(followSystem())">${c().followSystem}</button>
      <p class="note" style="margin-bottom:22px">${c().privacyLine}</p>
      <h1 class="lede">${c().ob1H.replace('\n','<br>')}</h1>
      <p class="body">${c().ob1B}</p>
      <div class="grow"></div>
      <button class="cta" onclick="obNext()">${c().obStart}</button>`;
  } else if(ob === 1){
    box.innerHTML = `<div class="eyebrow">${c().ob2E}</div><div class="grow"></div>
      <h1 class="lede">${c().ob2H}</h1><p class="body">${c().ob2B}</p>
      <div class="grow"></div><div class="obdots">${[0,1,2].map(i=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>
      <button class="cta" onclick="obNext()">${c().obNext}</button>`;
  } else if(ob === 2){
    box.innerHTML = `<div class="eyebrow">${c().ob3E}</div><div class="grow"></div>
      <h1 class="lede">${c().ob3H}</h1><p class="body">${c().ob3B}</p>
      <div class="grow"></div><div class="obdots">${[0,1,2].map(i=>`<i class="${i===1?'on':''}"></i>`).join('')}</div>
      <button class="cta" onclick="obNext()">${c().obNext}</button>`;
  } else {
    box.innerHTML = `<div class="eyebrow">${c().aboutT}</div><div class="grow"></div>
      <h1 class="lede sm">${c().somethingHappened}</h1><p class="body">${c().aboutB}</p>
      <div class="grow"></div><div class="obdots">${[0,1,2].map(i=>`<i class="${i===2?'on':''}"></i>`).join('')}</div>
      <button class="cta" onclick="finishOb()">${c().catchOne}</button>`;
  }
}

/* ---------- handler shims: inline attributes only see function declarations ---------- */
function setText(v){ if(flow){ flow.m.text=v; const b=$('fNext'); if(b) b.disabled = v.trim().length<2; } }
function setNote(v){ if(flow) flow.m.note=v; }
function setOther(field,v){ if(flow){ flow.m.other = flow.m.other||{}; flow.m.other[field]=v; } }
function openImport(){ $('importFile').click(); }
function followSystem(){ return (navigator.language||'en').toLowerCase().startsWith('zh') ? 'zh' : 'en'; }


/* ---------- voice capture ---------- */
const SR = typeof window!=='undefined' && (window.SpeechRecognition || window.webkitSpeechRecognition);
let rec = null, recBase = '';
function micReady(){
  const b = $('micBtn'); if(!b) return;
  if(SR) b.classList.remove('hidden');
}
function micDown(e){
  if(e && e.preventDefault) e.preventDefault();
  if(!SR || rec) return;
  try{
    rec = new SR();
    rec.lang = L==='zh' ? 'zh-CN' : 'en-US';
    rec.continuous = true; rec.interimResults = true;
    recBase = ($('fWhat').value || '').trim();
    rec.onresult = ev => {
      let s='';
      for(let i=0;i<ev.results.length;i++) s += ev.results[i][0].transcript;
      const v = (recBase ? recBase+' ' : '') + s;
      const ta = $('fWhat'); if(ta){ ta.value = v; setText(v); }
    };
    rec.onerror = () => micUp();
    rec.onend = () => { rec = null; const l=$('micLabel'); if(l) l.textContent = c().holdTalk;
      const b=$('micBtn'); if(b) b.classList.remove('rec'); };
    rec.start();
    $('micLabel').textContent = c().listening;
    $('micBtn').classList.add('rec');
  }catch(err){ rec = null; }
}
function micUp(){ if(rec){ try{ rec.stop(); }catch(e){} rec = null; }
  const l=$('micLabel'); if(l) l.textContent = c().holdTalk;
  const b=$('micBtn'); if(b) b.classList.remove('rec'); }

/* ---------- boot ---------- */
render();
if(!D.onboarded) startOnboard();
if(typeof window!=='undefined'){
  Object.defineProperty(window,'__kyp',{value:{
    get D(){return D}, set D(v){D=v}, get L(){return L}, get flow(){return flow}, KYP, Store
  }});
}
</script>
